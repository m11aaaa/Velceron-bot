name: Velceron app build

on:
  push:
    branches: [velceron-app]
  pull_request:
    branches: [velceron-app]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build client, server, and Root SDK networking
        run: npm run build
