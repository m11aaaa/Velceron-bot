name: Velceron app build and deploy

on:
  push:
    branches: [velceron-app]
  pull_request:
    branches: [velceron-app]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build client, server, and Root SDK networking
        run: npm run build
      - name: Package Root app
        if: github.event_name == 'push'
        run: npx rootsdk build package
      - name: Upload app to Root (requires ROOT_AUTH_TOKEN secret)
        if: github.event_name == 'push'
        env:
          ROOT_AUTH_TOKEN: ${{ secrets.ROOT_AUTH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$ROOT_AUTH_TOKEN" ]; then
            echo "::notice::Build and packaging completed. Add the ROOT_AUTH_TOKEN repository secret to enable automatic deployment to Root."
            exit 0
          fi

          mapfile -t packages < <(find . -path './node_modules' -prune -o -type f -name '*.pkg' -print)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::No .pkg file was generated by rootsdk build package."
            exit 1
          fi

          npx rootsdk upload package --file "${packages[0]}" --authToken "$ROOT_AUTH_TOKEN"
