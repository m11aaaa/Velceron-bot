name: Deploy Velceron dashboard and privacy policy

on:
  push:
    branches:
      - fix/root-sdk-migration
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
